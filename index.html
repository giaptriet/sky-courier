<!doctype html>
<!--
  index.html — trang chứa game Sky Courier.
  Trang này chỉ tạo một "tấm vải vẽ" (canvas) và nạp code trong thư mục src/.
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- Giúp game hiển thị đúng kích thước trên điện thoại, không cho phóng to bằng 2 ngón tay -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a3a">
  <title>Sky Courier</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1b2a3a; /* màu phần viền ngoài khung game */
      overflow: hidden;
      touch-action: none;  /* tắt cuộn/zoom bằng ngón tay khi chơi */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
